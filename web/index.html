<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euspell — the conversion drill</title>
<link rel="stylesheet" href="drill.css">
</head>
<body>

<!--
  Opens straight from the filesystem: no server, no build, no network. That is
  deliberate — it is how the page gets demoed offline and screenshotted for the
  store listing, and it rules out ES modules and fetch(), which Chrome blocks on
  file://. paragraphs.js assigns a global; drill.js reads it.
-->
<main id="drill"></main>

<script src="paragraphs.js"></script>
<script src="drill.js"></script>
<script>
  EuspellDrill.mount(document.getElementById('drill'), window.EUSPELL_PARAGRAPHS);
</script>

</body>
</html>
