<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euspell — the conversion game</title>
<!--
  The ?v= is a cache buster and has to be bumped whenever one of these files
  changes. The server sends Cache-Control: max-age=604800 for .css and .js but
  nothing for .html, so without it a returning visitor pairs fresh markup with a
  week-old stylesheet - which is how the masthead once arrived unstyled. Chromium
  drops the query when resolving file://, so opening this page from disk still
  works.
-->
<link rel="stylesheet" href="game.css?v=2026-08-19">
</head>
<!--
  The extension must not touch this page. The passage is presented in traditional
  spelling for the player to convert by hand, and scored against the euspell text
  in paragraphs.js - converting it would rewrite the question and hand over the
  answer. Honoured by the extension's dom-walker, which climbs the ancestor chain.
-->
<body data-euspell="off">

<!--
  The link home is absolute, not "/". This page is also opened straight from the
  filesystem for offline demos and store screenshots, where "/" resolves to the
  disk root and a relative "../" lands on a directory listing. An absolute URL is
  the only form that behaves in both places.
-->
<header class="masthead">
  <a class="home" href="https://euspell.org/">&#8592;&#8194;Euspell</a>
  <span class="what">The conversion game</span>
</header>

<main id="game"></main>

<!--
  Opens straight from the filesystem: no server, no build, no network. That is
  deliberate — it is how the page gets demoed offline and screenshotted for the
  store listing, and it rules out ES modules and fetch(), which Chrome blocks on
  file://. paragraphs.js assigns a global; game.js reads it.
-->
<script src="paragraphs.js?v=2026-08-19"></script>
<script src="game.js?v=2026-08-19"></script>
<script>
  EuspellGame.mount(document.getElementById('game'), window.EUSPELL_PARAGRAPHS);
</script>

</body>
</html>
